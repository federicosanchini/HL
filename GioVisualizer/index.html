<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>GioVisualizer</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg-page); }
      button { font-family: inherit; }

      :root {
        --bg-page:     #F2F2F7;
        --bg-card:     #FFFFFF;
        --bg-plot:     #FAFAFC;
        --bg-spark:    #F9F9FB;
        --bg-panel:    #FAFAFC;
        --bg-header:   #FFFFFF;
        --border-card: 0 2px 12px #00000012;
        --border-primary:  #E5E5EA;
        --border-subtle:   #F0F0F5;
        --border-grid:     #EBEBF0;
        --text-primary:    #1C1C1E;
        --text-secondary:  #6C6C70;
        --text-tertiary:   #AEAEB2;
        --hover-bg:        #FFFFFF;
        --hover-border:    #E5E5EA;
        --hover-text:      #1C1C1E;
        --color-accent:    #007AFF;
        --color-positive:  #34C759;
        --color-negative:  #FF3B30;
      }

      :root.dark {
        --bg-page:     #1C1917;
        --bg-card:     #262220;
        --bg-plot:     #211F1D;
        --bg-spark:    #1E1C1A;
        --bg-panel:    #1F1D1B;
        --bg-header:   #201E1B;
        --border-card: 0 2px 12px #00000040;
        --border-primary:  #3D3830;
        --border-subtle:   #302C28;
        --border-grid:     #353028;
        --text-primary:    #F0EBE3;
        --text-secondary:  #9E9590;
        --text-tertiary:   #7A7268;
        --hover-bg:        #262220;
        --hover-border:    #3D3830;
        --hover-text:      #F0EBE3;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
